<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{signin.title}">Giriş Yap</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #f4f4f9; 
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 320px; 
            position: relative;
        }
        .lang-switch { 
            text-align: right; 
            margin-bottom: 1rem; 
            font-size: 0.85rem; 
            position: relative;
            z-index: 9999;
        }
        .lang-switch a { 
            color: #007bff; 
            text-decoration: none; 
            margin-left: 5px; 
            cursor: pointer;
            padding: 4px 8px;
            display: inline-block;
        }
        .lang-switch a:hover { 
            text-decoration: underline; 
            font-weight: bold; 
        }
        .field { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; font-weight: bold; }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: .5rem; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            width: 100%; 
            padding: .7rem; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 1rem; 
        }
        button:hover { background: #0056b3; }
        .alert { 
            color: #721c24; 
            background-color: #f8d7da; 
            border: 1px solid #f5c6cb; 
            padding: .5rem; 
            border-radius: 4px; 
            margin-bottom: 1rem; 
            font-size: 0.85rem;
        }
        .alert-success { 
            color: #155724; 
            background-color: #d4edda; 
            border: 1px solid #c3e6cb; 
            padding: .5rem; 
            border-radius: 4px; 
            margin-bottom: 1rem; 
            font-size: 0.85rem;
        }
        .register-box {
            text-align: center; 
            margin-top: 1.5rem; 
            width: 100%;
        }
        .register-link {
            color: #007bff; 
            text-decoration: underline; 
            cursor: pointer; 
            display: inline-block; 
            margin-left: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="card">
    
    <!-- Dil Değiştirme -->
    <div class="lang-switch">
        🌐 <a href="?lang=tr">TR</a> | <a href="?lang=en">EN</a>
    </div>

    <h2 th:text="#{signin.header}">Welcome</h2>
    <p style="color: #666; font-size: 0.85rem; margin-top: -0.5rem; margin-bottom: 1.5rem;" th:text="#{signin.subheader}">
        Please enter your account credentials in order to signin
    </p>

    <!-- Dinamik AJAX Hata Mesajı Kutusu -->
    <div id="js-error-alert" class="alert" style="display: none;" th:text="#{signin.error.bad_credentials}">Hatalı kullanıcı adı veya şifre!</div>

    <!-- URL Parametre Mesajları -->
    <th:block th:if="${param.logout}">
        <div class="alert-success" th:text="#{signin.success.logout}">Başarıyla çıkış yapıldı.</div>
    </th:block>

    <th:block th:if="${param.registered}">
        <div class="alert-success" th:text="#{signin.success.registered}">Kayıt başarılı! Şimdi giriş yapabilirsiniz.</div>
    </th:block>

    <!-- Giriş Formu (action kaldırıldı, id eklendi) -->
    <form id="loginForm">
        <div class="field">
            <label th:text="#{signin.label.username}">Username</label>
            <input type="text" id="username" name="username" th:placeholder="#{signin.placeholder.username}" required />
        </div>
        <div class="field">
            <label th:text="#{signin.label.password}">Password</label>
            <input type="password" id="password" name="password" th:placeholder="#{signin.placeholder.password}" required />
        </div>

        <button type="submit" th:text="#{signin.button.submit}">Sign In</button>
    </form>

    <!-- Kayıt Bağlantısı -->
    <div class="register-box">
        <span th-text="#{signin.link.no_account}">Don't have an account?</span>
        <a th-href="@{/register(lang=${#locale.language})}" class="register-link" th:text="#{signin.link.signup}">Sign Up</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Sayfanın normal HTML form gibi post edilmesini ve DOSYA İNDİRMESİNİ engeller

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const errorAlert = document.getElementById('js-error-alert');

        errorAlert.style.display = 'none';

        try {
            // REST Controller endpoint'imize arka planda JSON gönderiyoruz
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            const data = await response.json();

            if (response.ok) {
                // Üretilen JWT Token'ı tarayıcı hafızasına (localStorage) saklıyoruz
                localStorage.setItem('jwt_token', data.token);
                
                // Ana sayfaya yönlendiriyoruz
                window.location.href = '/'; 
            } else {
                errorAlert.textContent = data.message || 'Giriş yapılamadı!';
                errorAlert.style.display = 'block';
            }
        } catch (err) {
            console.error('Bağlantı hatası:', err);
            errorAlert.textContent = 'Sunucuyla iletişim kurulamadı!';
            errorAlert.style.display = 'block';
        }
    });
</script>

</body>
</html>
