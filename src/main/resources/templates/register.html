<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        .field { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; }
        input { width: 100%; padding: .5rem; box-sizing: border-box; }
        button { width: 100%; padding: .7rem; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .link { margin-top: 1rem; text-align: center; display: block; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h2>Kayıt Ol</h2>
    <form th-action="@{/register}" method="post">
        <div class="field">
            <label>Kullanıcı Adı</label>
            <input type="text" name="username" required />
        </div>
        <div class="field">
            <label>Şifre</label>
            <input type="password" name="password" required />
        </div>
        <button type="submit">Kaydol</button>
    </form>
    <a href="/login" class="link">Zaten hesabınız var mı? Giriş Yapın</a>
</div>
</body>
</html>
