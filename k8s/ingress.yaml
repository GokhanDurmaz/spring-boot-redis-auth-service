apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  tls:
  - hosts:
    - mysite.local
    secretName: mysite-tls-secret
  rules:
  - host: mysite.local
    http:
      paths:
      # 1. Spring Boot API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: springboot-service
            port:
              number: 8080

      # 2. Kibana UI
      - path: /kibana
        pathType: Prefix
        backend:
          service:
            name: kibana-service
            port:
              number: 5601

      # 3. Elasticsearch API
      - path: /elasticsearch
        pathType: Prefix
        backend:
          service:
            name: elasticsearch-service
            port:
              number: 9200

      # 4. React Frontend App
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-app-service
            port:
              number: 80